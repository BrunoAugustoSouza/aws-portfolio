AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Resources:
  MyFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.lambda_handler
      Runtime: python3.11
      CodeUri: .
      Timeout: 420
      Environment:
        Variables:
          BUCKET_NAME: nyc-tlc-analytics
          AWS_REGION: us-east-1